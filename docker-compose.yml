services:
  # --------------------------------------------------------------------------
  # 1. Neo4j Graph Database with Pre-loaded Vector Index & Seed Data
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26-community
    container_name: verdictnet-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # 2. Automated Seeder Service (Populates Neo4j on First Boot)
  # --------------------------------------------------------------------------
  seeder:
    image: neo4j:5.26-community
    container_name: verdictnet-seeder
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data/seed_graph.cypher:/seed_graph.cypher:ro
    environment:
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    command: >
      bash -c "
        echo '🚀 Seeding Neo4j with Texas Caselaw Graph and Vector Embeddings...';
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p ${NEO4J_PASSWORD} -f /seed_graph.cypher;
        echo '✅ Seed completed successfully!';
      "
    restart: "no"

  # --------------------------------------------------------------------------
  # 3. VerdictNet Web Application & API (Gemini 3.7 + Vis.js)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verdictnet-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
